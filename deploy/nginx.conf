worker_processes auto;
pid /tmp/electra-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    log_format public_test '$time_iso8601 $request_method $uri $status $request_time $upstream_response_time $upstream_addr';
    access_log /dev/stdout public_test;
    upstream electra_api {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=10s;
        server api-secondary:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }
    limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=business_per_ip:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    server {
        listen 8080;
        client_max_body_size 1m;
        client_body_timeout 10s;
        keepalive_timeout 15s;
        limit_req_status 429;
        limit_conn_status 429;
        limit_conn connections_per_ip 100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
        # Do not opt into non_idempotent retries: a POST must never be replayed after sending.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Request-ID $request_id always;
        error_page 429 = @limited;
        location ~ /auth/(login|sms-code)$ {
            limit_req zone=login_per_ip burst=20 nodelay;
            proxy_pass http://electra_api;
        }
        location / {
            limit_req zone=business_per_ip burst=200 nodelay;
            proxy_pass http://electra_api;
        }
        location @limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"code":42900,"message":"请求过于频繁，请稍后重试","data":null,"timestamp":"$time_iso8601"}';
        }
    }
}
